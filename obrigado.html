<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagem enviada | JM Engenharia e Consultoria Ambiental</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Inter",sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px;color:#fff;text-align:center;
      background:radial-gradient(900px 500px at 80% -10%,rgba(43,179,163,.25),transparent 60%),
      linear-gradient(150deg,#0d2342 0%,#173a66 55%,#124d33 130%)}
    .card{max-width:520px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:48px 38px;backdrop-filter:blur(10px)}
    .check{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,#1e7a3c,#3fae63);display:grid;place-items:center;margin:0 auto 24px;box-shadow:0 10px 30px rgba(30,122,60,.45)}
    h1{font-family:"Sora",sans-serif;font-size:1.6rem;margin-bottom:12px}
    p{color:#c9d8ec;font-size:.98rem;margin-bottom:28px}
    a{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem;color:#fff;text-decoration:none;background:linear-gradient(135deg,#1e7a3c,#3fae63);padding:13px 26px;border-radius:999px;transition:.25s}
    a:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(30,122,60,.45)}
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Mensagem enviada com sucesso!</h1>
    <p>Obrigado pelo contato. Nossa equipe retornará o mais breve possível pelo e-mail ou telefone informado.</p>
    <a href="index.html">← Voltar ao site</a>
  </div>
</body>
</html>
